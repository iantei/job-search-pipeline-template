<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search — Pipeline</title>
<style>
  :root {
    /* cool-biased neutrals */
    --bg: #f7f8fa; --panel: #ffffff; --panel-2: #fbfcfe;
    --ink: #14171d; --ink-soft: #3b4150; --muted: #6b7280; --faint: #97a0ad;
    --line: #e6e9ef; --line-soft: #eef1f5;
    --accent: #4b63e6; --accent-ink: #3b50c9; --accent-wash: #eef1fe;
    /* fit severity (separate from accent) */
    --strong: #1f9d55; --strong-wash: #e9f8ef;
    --moderate: #c97a12; --moderate-wash: #fdf3e3;
    --stretch: #d64550; --stretch-wash: #fdecee;
    --unknown: #8a93a2; --unknown-wash: #f0f2f6;
    /* stage funnel (cool -> warm progression) */
    --st-review: #64748b; --st-toapply: #4b63e6; --st-applied: #2b8ac6;
    --st-interview: #7a5af5; --st-offer: #1f9d55; --st-rejected: #d64550;
    --st-skip: #9aa2b1;
    --shadow-sm: 0 1px 2px rgba(20,23,29,.06);
    --shadow-md: 0 4px 14px rgba(20,23,29,.08), 0 1px 3px rgba(20,23,29,.06);
    --shadow-lg: 0 18px 50px rgba(20,23,29,.20);
    --radius: 12px; --radius-sm: 9px;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f14; --panel: #161922; --panel-2: #1b1f2a;
      --ink: #e9ebf1; --ink-soft: #c3c8d4; --muted: #8b93a3; --faint: #6b7383;
      --line: #232838; --line-soft: #1e222f;
      --accent: #8095ff; --accent-ink: #9aabff; --accent-wash: #1a2036;
      --strong: #4ece82; --strong-wash: #12271a;
      --moderate: #e6a03c; --moderate-wash: #2a2011;
      --stretch: #f0737d; --stretch-wash: #2c1518;
      --unknown: #7b8494; --unknown-wash: #1b1f2a;
      --st-review: #7f8ea6; --st-toapply: #8095ff; --st-applied: #4db6e6;
      --st-interview: #a78bff; --st-offer: #4ece82; --st-rejected: #f0737d;
      --st-skip: #6b7280;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow-md: 0 6px 18px rgba(0,0,0,.45);
      --shadow-lg: 0 22px 60px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"] {
    --bg: #f7f8fa; --panel: #ffffff; --panel-2: #fbfcfe;
    --ink: #14171d; --ink-soft: #3b4150; --muted: #6b7280; --faint: #97a0ad;
    --line: #e6e9ef; --line-soft: #eef1f5;
    --accent: #4b63e6; --accent-ink: #3b50c9; --accent-wash: #eef1fe;
    --strong: #1f9d55; --strong-wash: #e9f8ef;
    --moderate: #c97a12; --moderate-wash: #fdf3e3;
    --stretch: #d64550; --stretch-wash: #fdecee;
    --unknown: #8a93a2; --unknown-wash: #f0f2f6;
    --st-review: #64748b; --st-toapply: #4b63e6; --st-applied: #2b8ac6;
    --st-interview: #7a5af5; --st-offer: #1f9d55; --st-rejected: #d64550;
    --st-skip: #9aa2b1;
    --shadow-sm: 0 1px 2px rgba(20,23,29,.06);
    --shadow-md: 0 4px 14px rgba(20,23,29,.08), 0 1px 3px rgba(20,23,29,.06);
    --shadow-lg: 0 18px 50px rgba(20,23,29,.20);
  }
  :root[data-theme="dark"] {
    --bg: #0d0f14; --panel: #161922; --panel-2: #1b1f2a;
    --ink: #e9ebf1; --ink-soft: #c3c8d4; --muted: #8b93a3; --faint: #6b7383;
    --line: #232838; --line-soft: #1e222f;
    --accent: #8095ff; --accent-ink: #9aabff; --accent-wash: #1a2036;
    --strong: #4ece82; --strong-wash: #12271a;
    --moderate: #e6a03c; --moderate-wash: #2a2011;
    --stretch: #f0737d; --stretch-wash: #2c1518;
    --unknown: #7b8494; --unknown-wash: #1b1f2a;
    --st-review: #7f8ea6; --st-toapply: #8095ff; --st-applied: #4db6e6;
    --st-interview: #a78bff; --st-offer: #4ece82; --st-rejected: #f0737d;
    --st-skip: #6b7280;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 6px 18px rgba(0,0,0,.45);
    --shadow-lg: 0 22px 60px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 14.5px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); font-weight: 650; }
  button { font-family: inherit; }
  a { color: var(--accent-ink); }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  .lockup { display: flex; align-items: center; gap: 11px; }
  .glyph {
    width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto;
    background: linear-gradient(150deg, var(--accent), var(--st-interview));
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px;
    box-shadow: var(--shadow-sm);
  }
  .lockup .t { font-size: 15px; font-weight: 650; letter-spacing: -.01em; line-height: 1.1; }
  .lockup .s { font-size: 11px; color: var(--muted); }
  .lockup .s .num { color: var(--ink-soft); }

  .segtoggle { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); padding: 3px; border-radius: 10px; }
  .segtoggle button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    padding: 6px 13px; border-radius: 7px; font-size: 13px; font-weight: 550; transition: color .15s;
  }
  .segtoggle button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-sm); }

  .grow { flex: 1 1 auto; }
  .search {
    display: flex; align-items: center; gap: 7px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; min-width: 210px;
    transition: border-color .15s, box-shadow .15s;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
  .search svg { width: 15px; height: 15px; color: var(--faint); flex: 0 0 auto; }
  .search input { border: 0; background: transparent; color: var(--ink); padding: 8px 0; font-size: 13.5px; width: 100%; outline: none; }
  .search input::placeholder { color: var(--faint); }

  .iconbtn {
    display: inline-grid; place-items: center; width: 34px; height: 34px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
    border-radius: 9px; cursor: pointer; transition: border-color .15s, color .15s;
  }
  .iconbtn:hover { border-color: var(--accent); color: var(--accent-ink); }
  .iconbtn svg { width: 16px; height: 16px; }
  .menu-wrap { position: relative; }
  .menu {
    position: absolute; right: 0; top: 40px; z-index: 40; min-width: 168px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 11px;
    box-shadow: var(--shadow-lg); padding: 5px; display: none;
  }
  .menu.open { display: block; }
  .menu button {
    display: flex; width: 100%; align-items: center; gap: 9px; border: 0; background: transparent;
    color: var(--ink); padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; text-align: left;
  }
  .menu button:hover { background: var(--bg); }
  .menu .sep { height: 1px; background: var(--line); margin: 5px 4px; }

  /* ---------- pipeline summary ---------- */
  .pipeline {
    flex: 0 0 auto; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 12px 20px 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .funnelbar { display: flex; height: 8px; border-radius: 6px; overflow: hidden; background: var(--line-soft); gap: 2px; }
  .funnelbar span { min-width: 2px; transition: flex-basis .35s ease; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; }
  .legpill {
    display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 9px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--panel-2);
    cursor: pointer; transition: border-color .15s, background .15s; user-select: none;
  }
  .legpill:hover { border-color: var(--accent); }
  .legpill.dim { opacity: .42; }
  .legpill .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .legpill .lbl { font-size: 12px; color: var(--ink-soft); font-weight: 550; }
  .legpill .n { font-size: 12px; color: var(--ink); font-weight: 650; }

  /* ---------- board ---------- */
  .stage { flex: 1 1 auto; min-height: 0; }
  .board {
    height: 100%; display: flex; gap: 14px; padding: 16px 20px 20px; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: thin;
  }
  .board::-webkit-scrollbar { height: 10px; }
  .board::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 3px solid var(--bg); }
  .col {
    flex: 0 0 288px; display: flex; flex-direction: column; min-height: 0;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px;
    transition: border-color .15s, background .15s;
  }
  .col.drop { border-color: var(--accent); background: var(--accent-wash); }
  .col-head {
    display: flex; align-items: center; gap: 8px; padding: 12px 13px 10px;
    border-bottom: 1px solid var(--line-soft); position: sticky; top: 0;
  }
  .col-head .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .col-head .name { font-size: 12.5px; font-weight: 650; letter-spacing: .01em; }
  .col-head .cnt { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 600; }
  .col-body { padding: 10px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 9px; scrollbar-width: thin; }
  .col-body::-webkit-scrollbar { width: 8px; }
  .col-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--panel-2); }
  .col-ghost { border: 1px dashed var(--line); border-radius: var(--radius-sm); color: var(--faint); font-size: 12px; text-align: center; padding: 16px 8px; }

  /* ---------- card ---------- */
  .card {
    position: relative; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: 11px 12px 11px 14px; cursor: grab;
    box-shadow: var(--shadow-sm); transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    display: flex; flex-direction: column; gap: 7px;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--unknown);
  }
  .card.fit-strong::before { background: var(--strong); }
  .card.fit-moderate::before { background: var(--moderate); }
  .card.fit-stretch::before { background: var(--stretch); }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--line); }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .5; }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card .ch { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card .co { font-size: 14px; font-weight: 650; letter-spacing: -.005em; line-height: 1.25; }
  .card .ro { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .fitdot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; margin-top: 5px; }
  .fitdot.fit-strong { background: var(--strong); } .fitdot.fit-moderate { background: var(--moderate); }
  .fitdot.fit-stretch { background: var(--stretch); } .fitdot.fit-unknown { background: var(--unknown); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 11px; color: var(--ink-soft); background: var(--bg); border: 1px solid var(--line-soft); border-radius: 6px; padding: 2px 7px; display: inline-flex; gap: 5px; align-items: center; }
  .chip.sal { color: var(--strong); }
  .chip svg { width: 11px; height: 11px; opacity: .7; }
  .card .foot { display: flex; gap: 6px; margin-top: 1px; }
  .qlink {
    font-size: 11.5px; text-decoration: none; color: var(--muted); border: 1px solid var(--line-soft);
    padding: 3px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; transition: color .12s, border-color .12s;
  }
  .qlink:hover { color: var(--accent-ink); border-color: var(--accent); }
  .qlink svg { width: 11px; height: 11px; }

  /* ---------- catalog ---------- */
  .catalog { height: 100%; overflow-y: auto; padding: 16px 20px 40px; }
  .cluster { margin-top: 6px; }
  .cluster + .cluster { margin-top: 26px; }
  .cluster-h { display: flex; align-items: baseline; gap: 10px; margin: 0 2px 12px; }
  .cluster-h .nm { font-size: 13px; font-weight: 650; letter-spacing: .02em; }
  .cluster-h .ln { flex: 1; height: 1px; background: var(--line); }
  .cluster-h .ct { font-size: 12px; color: var(--faint); }
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .catalog .card { cursor: pointer; }
  .catalog .card::after { content: none; }

  .empty { color: var(--muted); font-size: 14px; padding: 60px 20px; text-align: center; }

  /* ---------- drawer ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(10,12,18,.42); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(440px, 92vw); z-index: 60;
    background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow-lg);
    transform: translateX(100%); transition: transform .26s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .dr-head { padding: 20px 22px 16px; border-bottom: 1px solid var(--line); position: relative; }
  .dr-close { position: absolute; top: 16px; right: 16px; }
  .dr-cluster { color: var(--faint); }
  .dr-co { font-size: 20px; font-weight: 700; letter-spacing: -.02em; margin: 6px 0 2px; text-wrap: balance; }
  .dr-ro { font-size: 14px; color: var(--muted); }
  .dr-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
  .dr-body { padding: 18px 22px 26px; overflow-y: auto; }
  .dr-fit { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 650; padding: 4px 11px; border-radius: 999px; }
  .dr-fit.fit-strong { color: var(--strong); background: var(--strong-wash); }
  .dr-fit.fit-moderate { color: var(--moderate); background: var(--moderate-wash); }
  .dr-fit.fit-stretch { color: var(--stretch); background: var(--stretch-wash); }
  .dr-fit.fit-unknown { color: var(--unknown); background: var(--unknown-wash); }
  .dr-links { display: flex; gap: 8px; margin: 16px 0 22px; }
  .dr-links a {
    flex: 1; text-align: center; text-decoration: none; font-size: 13px; font-weight: 550;
    padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); color: var(--ink-soft);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all .12s;
  }
  .dr-links a.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .dr-links a.primary:hover { background: var(--accent-ink); }
  .dr-links a:hover { border-color: var(--accent); color: var(--accent-ink); }
  .dr-links a svg { width: 14px; height: 14px; }
  .dr-section-label { margin: 4px 0 10px; }
  .stage-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
  .stage-pill {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
    padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 550; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; transition: all .12s;
  }
  .stage-pill .dot { width: 8px; height: 8px; border-radius: 50%; }
  .stage-pill:hover { border-color: var(--accent); }
  .stage-pill.on { color: #fff; border-color: transparent; }
  .prose { font-size: 13.5px; line-height: 1.62; color: var(--ink-soft); white-space: pre-wrap; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  @media (max-width: 640px) {
    .lockup .s { display: none; }
    .search { min-width: 0; }
  }

</style>
</head>
<body>
<div class="topbar">
  <div class="lockup">
    <div class="glyph">◆</div>
    <div>
      <div class="t">Job Search</div>
      <div class="s"><span class="num" id="head-total">0</span> drafts · built <span id="head-gen"></span></div>
    </div>
  </div>
  <div class="segtoggle" id="viewtoggle">
    <button class="on" data-view="board">Board</button>
    <button data-view="catalog">Catalog</button>
  </div>
  <span class="grow"></span>
  <label class="search">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
    <input id="search" type="search" placeholder="Search company, role, location…" autocomplete="off">
  </label>
  <button class="iconbtn" id="themebtn" title="Toggle theme" aria-label="Toggle theme">
    <svg id="theme-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 11.5A7 7 0 018.5 3 7 7 0 1017 11.5z"/></svg>
  </button>
  <div class="menu-wrap">
    <button class="iconbtn" id="menubtn" title="More" aria-label="More actions">
      <svg viewBox="0 0 20 20" fill="currentColor"><circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="16" cy="10" r="1.6"/></svg>
    </button>
    <div class="menu" id="menu">
      <button id="export"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 3v10M6 9l4 4 4-4M4 16h12"/></svg>Export status</button>
      <button id="import"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 13V3M6 7l4-4 4 4M4 16h12"/></svg>Import status</button>
      <div class="sep"></div>
      <button id="resetstatus"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 10a6 6 0 106-6 6 6 0 00-4.5 2M5 3v3h3"/></svg>Reset all to “To review”</button>
    </div>
  </div>
  <input type="file" id="importfile" accept="application/json" style="display:none">
</div>

<div class="pipeline">
  <div class="funnelbar" id="funnelbar"></div>
  <div class="legend" id="legend"></div>
</div>

<div class="stage">
  <div class="board" id="board"></div>
  <div class="catalog" id="catalog" style="display:none"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<script>
const DATA = /*__DATA__*/;
const STORE_KEY = "jobDashStatus.v1";
const THEME_KEY = "jobDashTheme.v1";

const STAGES = [
  ["review",    "To review", "var(--st-review)"],
  ["toapply",   "To apply",   "var(--st-toapply)"],
  ["applied",   "Applied",    "var(--st-applied)"],
  ["interview", "Interview",  "var(--st-interview)"],
  ["offer",     "Offer",      "var(--st-offer)"],
  ["rejected",  "Rejected",   "var(--st-rejected)"],
  ["skip",      "Skip",       "var(--st-skip)"],
];
const STAGE_LABEL = Object.fromEntries(STAGES.map(s => [s[0], s[1]]));
const STAGE_COLOR = Object.fromEntries(STAGES.map(s => [s[0], s[2]]));
const FIT_LABEL = { strong: "Strong fit", moderate: "Moderate fit", stretch: "Stretch", unknown: "Unrated" };

let statusMap = load(STORE_KEY, {});
let search = "";
let hiddenStages = new Set();   // stages toggled off in the legend
let view = "board";
let openId = null;

function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }
function save(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
function statusOf(p) { return statusMap[p.id] || "review"; }
function setStatus(p, s) { statusMap[p.id] = s; save(STORE_KEY, statusMap); render(); }
function esc(s) { return (s || "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function matches(p) {
  if (!search) return true;
  return (p.company + " " + p.role + " " + p.location + " " + p.cluster).toLowerCase().includes(search.toLowerCase());
}

const ICON = {
  ext: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 4H4v12h12v-3M12 4h4v4M16 4l-7 7"/></svg>',
  doc: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 3h7l3 3v11H5zM12 3v3h3"/></svg>',
  pin: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 17s5-4.4 5-8a5 5 0 10-10 0c0 3.6 5 8 5 8z"/><circle cx="10" cy="9" r="1.6"/></svg>',
};

/* ---------- pipeline summary ---------- */
function counts() {
  const c = Object.fromEntries(STAGES.map(s => [s[0], 0]));
  for (const p of DATA.postings) if (matches(p)) c[statusOf(p)]++;
  return c;
}
function renderPipeline() {
  const c = counts();
  const total = Object.values(c).reduce((a, b) => a + b, 0) || 1;
  document.getElementById("funnelbar").innerHTML = STAGES.map(([k,,col]) =>
    c[k] ? `<span style="flex:${c[k]} 0 0;background:${col}" title="${STAGE_LABEL[k]}: ${c[k]}"></span>` : ""
  ).join("");
  document.getElementById("legend").innerHTML = STAGES.map(([k, l, col]) =>
    `<div class="legpill ${hiddenStages.has(k) ? "dim" : ""}" data-stage="${k}">
       <span class="dot" style="background:${col}"></span>
       <span class="lbl">${l}</span><span class="n num">${c[k]}</span>
     </div>`).join("");
  document.querySelectorAll(".legpill").forEach(el => el.onclick = () => {
    const s = el.dataset.stage;
    hiddenStages.has(s) ? hiddenStages.delete(s) : hiddenStages.add(s);
    render();
  });
  document.getElementById("head-total").textContent = DATA.postings.length;
}

/* ---------- card ---------- */
function metaChips(p) {
  const out = [];
  if (p.location) out.push(`<span class="chip">${ICON.pin}${esc(p.location)}</span>`);
  if (p.salary) out.push(`<span class="chip sal num">${esc(p.salary)}</span>`);
  if (!p.resume_pdf) out.push(`<span class="chip" style="color:var(--faint);border-style:dashed">✎ no resume yet</span>`);
  return out.join("");
}
function cardHTML(p, forBoard) {
  const links = [];
  if (p.posting_url) links.push(`<a class="qlink" href="${esc(p.posting_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${ICON.ext}Posting</a>`);
  if (p.resume_pdf) links.push(`<a class="qlink" href="${esc(p.resume_pdf)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${ICON.doc}Resume</a>`);
  return `<div class="card fit-${p.fit}" data-id="${esc(p.id)}" tabindex="0" ${forBoard ? 'draggable="true"' : ""}>
    <div class="ch">
      <div><div class="co">${esc(p.company)}</div><div class="ro">${esc(p.role)}</div></div>
      <span class="fitdot fit-${p.fit}" title="${FIT_LABEL[p.fit]}"></span>
    </div>
    ${metaChips(p) ? `<div class="chips">${metaChips(p)}</div>` : ""}
    ${links.length ? `<div class="foot">${links.join("")}</div>` : ""}
  </div>`;
}
function wireCards(root, forBoard) {
  root.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => { if (!el.dataset.dragged) openDrawer(el.dataset.id); });
    el.addEventListener("keydown", e => { if (e.key === "Enter") openDrawer(el.dataset.id); });
    if (forBoard) {
      el.addEventListener("dragstart", e => {
        e.dataTransfer.setData("text/plain", el.dataset.id);
        e.dataTransfer.effectAllowed = "move";
        el.classList.add("dragging"); el.dataset.dragged = "1";
      });
      el.addEventListener("dragend", () => {
        el.classList.remove("dragging");
        setTimeout(() => { delete el.dataset.dragged; }, 60);
      });
    }
  });
}

/* ---------- board ---------- */
function renderBoard() {
  const board = document.getElementById("board");
  board.innerHTML = STAGES.filter(([k]) => !hiddenStages.has(k)).map(([k, l, col]) => {
    const items = DATA.postings.filter(p => matches(p) && statusOf(p) === k);
    const body = items.length
      ? items.map(p => cardHTML(p, true)).join("")
      : `<div class="col-ghost">Drop here</div>`;
    return `<section class="col" data-status="${k}">
      <div class="col-head"><span class="dot" style="background:${col}"></span>
        <span class="name">${l}</span><span class="cnt num">${items.length}</span></div>
      <div class="col-body">${body}</div>
    </section>`;
  }).join("");
  wireCards(board, true);
  board.querySelectorAll(".col").forEach(col => {
    const zone = col.querySelector(".col-body");
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("drop"); });
    col.addEventListener("dragleave", e => { if (!col.contains(e.relatedTarget)) col.classList.remove("drop"); });
    col.addEventListener("drop", e => {
      e.preventDefault(); col.classList.remove("drop");
      const p = DATA.postings.find(x => x.id === e.dataTransfer.getData("text/plain"));
      if (p) setStatus(p, col.dataset.status);
    });
  });
}

/* ---------- catalog ---------- */
function renderCatalog() {
  const el = document.getElementById("catalog");
  const groups = {};
  for (const p of DATA.postings) {
    if (!matches(p) || hiddenStages.has(statusOf(p))) continue;
    (groups[p.cluster] = groups[p.cluster] || []).push(p);
  }
  const keys = Object.keys(groups);
  if (!keys.length) { el.innerHTML = `<div class="empty">Nothing matches your search.</div>`; return; }
  el.innerHTML = keys.map(cl =>
    `<div class="cluster"><div class="cluster-h"><span class="nm">${esc(cl)}</span><span class="ln"></span><span class="ct num">${groups[cl].length}</span></div>
     <div class="shelf">${groups[cl].map(p => cardHTML(p, false)).join("")}</div></div>`).join("");
  wireCards(el, false);
}

/* ---------- drawer ---------- */
function openDrawer(id) {
  const p = DATA.postings.find(x => x.id === id); if (!p) return;
  openId = id;
  const cur = statusOf(p);
  const links = [];
  if (p.posting_url) links.push(`<a href="${esc(p.posting_url)}" target="_blank" rel="noopener">${ICON.ext}View posting</a>`);
  if (p.resume_pdf) links.push(`<a class="primary" href="${esc(p.resume_pdf)}" target="_blank" rel="noopener">${ICON.doc}Open resume</a>`);
  const meta = [];
  if (p.location) meta.push(`<span class="chip">${ICON.pin}${esc(p.location)}</span>`);
  if (p.salary) meta.push(`<span class="chip sal num">${esc(p.salary)}</span>`);
  if (p.date) meta.push(`<span class="chip num">${esc(p.date)}</span>`);
  document.getElementById("drawer").innerHTML = `
    <div class="dr-head">
      <button class="iconbtn dr-close" id="dr-close" aria-label="Close">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
      <div class="eyebrow dr-cluster">${esc(p.cluster)}</div>
      <div class="dr-co">${esc(p.company)}</div>
      <div class="dr-ro">${esc(p.role)}</div>
      <div class="dr-meta">
        <span class="dr-fit fit-${p.fit}"><span class="fitdot fit-${p.fit}"></span>${FIT_LABEL[p.fit]}</span>
        ${meta.join("")}
      </div>
    </div>
    <div class="dr-body">
      ${links.length ? `<div class="dr-links">${links.join("")}</div>` : ""}
      <div class="eyebrow dr-section-label">Stage</div>
      <div class="stage-pills">${STAGES.map(([k, l, col]) =>
        `<button class="stage-pill ${k === cur ? "on" : ""}" data-stage="${k}"
           style="${k === cur ? `background:${col}` : ""}"><span class="dot" style="background:${col}"></span>${l}</button>`).join("")}</div>
      <div class="eyebrow dr-section-label">Fit &amp; gaps</div>
      <div class="prose">${esc(p.body) || "No assessment recorded."}</div>
    </div>`;
  const dr = document.getElementById("drawer");
  dr.querySelector("#dr-close").onclick = closeDrawer;
  dr.querySelectorAll(".stage-pill").forEach(b => b.onclick = () => { setStatus(p, b.dataset.stage); openDrawer(id); });
  dr.classList.add("open"); dr.setAttribute("aria-hidden", "false");
  document.getElementById("scrim").classList.add("open");
}
function closeDrawer() {
  openId = null;
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("drawer").setAttribute("aria-hidden", "true");
  document.getElementById("scrim").classList.remove("open");
}

/* ---------- render ---------- */
function render() {
  document.getElementById("board").style.display = view === "board" ? "flex" : "none";
  document.getElementById("catalog").style.display = view === "catalog" ? "block" : "none";
  renderPipeline();
  if (view === "board") renderBoard(); else renderCatalog();
}

/* ---------- theme ---------- */
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
applyTheme(load(THEME_KEY, null));
document.getElementById("themebtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const isDark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = isDark ? "light" : "dark";
  applyTheme(next); save(THEME_KEY, next);
};

/* ---------- events ---------- */
document.querySelectorAll("#viewtoggle button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#viewtoggle button").forEach(x => x.classList.toggle("on", x === b));
  view = b.dataset.view; render();
});
document.getElementById("search").addEventListener("input", e => { search = e.target.value; render(); });
document.getElementById("head-gen").textContent = DATA.generated;

const menu = document.getElementById("menu");
document.getElementById("menubtn").onclick = e => { e.stopPropagation(); menu.classList.toggle("open"); };
document.addEventListener("click", () => menu.classList.remove("open"));
document.getElementById("export").onclick = () => {
  const blob = new Blob([JSON.stringify(statusMap, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "job-status.json"; a.click();
};
document.getElementById("import").onclick = () => document.getElementById("importfile").click();
document.getElementById("importfile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { statusMap = JSON.parse(r.result); save(STORE_KEY, statusMap); render(); } catch { alert("Could not read that file — expected a JSON status export."); } };
  r.readAsText(f);
});
document.getElementById("resetstatus").onclick = () => {
  if (confirm("Reset every job back to “To review”? This clears your tracked stages.")) { statusMap = {}; save(STORE_KEY, statusMap); render(); }
};
document.getElementById("scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeDrawer(); menu.classList.remove("open"); } });

render();
</script>
</body>
</html>
